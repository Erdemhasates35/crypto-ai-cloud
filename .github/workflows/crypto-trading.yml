name: Crypto AI Trading — execution disabled pending independent Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-disabled:
    name: Live execution disabled — Guard integration required
    runs-on: ubuntu-latest
    steps:
      - name: Explain execution boundary
        shell: bash
        run: |
          echo "::notice::This workflow intentionally does not start the trading script."
          echo "::notice::The current script can submit Binance Futures market orders with sandbox=false."
          echo "::notice::No independent OMNIQUANT Guard approval, calibrated probability, loss controls, or venue reconciliation is connected."
          echo "::notice::Scheduled and push-triggered execution remains disabled until those controls are implemented and tested."
          echo "No exchange credentials were loaded. No market data request or order was sent."
